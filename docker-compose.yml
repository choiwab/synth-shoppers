services:
  shopee:
    build:
      context: ./frontend/shopee
      dockerfile: Dockerfile
    ports:
      - "5174:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      # Inside Docker, backend Chromium reaches Shopee via Compose DNS.
      # Host browsers still use http://localhost:5174.
      LISTING_BASE_URL: http://shopee
      BROWSER_USE_AUTONOMOUS: "0"
    ports:
      - "8000:8000"
    depends_on:
      shopee:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:8000"
        VITE_WS_BASE: "ws://localhost:8000"
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
